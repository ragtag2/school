version: "3.8"

services:
  mysql-db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timesheet_db
    ports:
      - "3307:3306"    # host:container
    volumes:
      - db:/var/lib/mysql

  app-timesheet:
    depends_on:
      - mysql-db
    image: ragtag2/school-app:latest
    # If you want to build locally instead of using DockerHub image:
    # build: .
    restart: on-failure
    ports:
      - "9093:9093"   # host:container (your app runs on 8089 in example)
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url" : "jdbc:mysql://mysql-db:3306/timesheet_db?createDatabaseIfNotExist=true",
        "spring.datasource.username" : "root",
        "spring.datasource.password" : "root",
        "spring.jpa.hibernate.ddl-auto" : "update"
      }'
    stdin_open: true
    tty: true

volumes:
  db:
